name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4

      - name: Build QoderMeter.app
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify bundle
        run: |
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' QoderMeter.app/Contents/Info.plist
          test -x QoderMeter.app/Contents/MacOS/applet

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QoderMeter-macos
          path: macos/QoderMeter.app
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - name: Parse check
        shell: powershell
        run: ./tools/parse-check.ps1
